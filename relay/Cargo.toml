[package]
name = "stonechat-relay"
version = "0.1.0"
edition = "2021"
description = "Blind store-and-forward relay + APNs waker for stonechat. Forwards already-sealed (E2E-encrypted) envelopes between peers and pushes the recipient awake; never sees message content."

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
ed25519-dalek = "2"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
jsonwebtoken = "9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
